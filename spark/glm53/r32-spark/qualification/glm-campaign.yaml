  A new fused_recurrent_kda_fwd_kernel compiled at 15:04:02 on all four ranks.
  C1 and prefill scouts preceded that interference. C1 output 52.6031 tok/s,
  steps 19.9608, acceptance 2.6353; compare R29 C1 repeat 51.4556/19.9010/2.5856.
  Prefill 2739/2944/2944/2930/2859 tok/s at 8/16/32/64/128K, within 0.35% of R29.
  After the user stopped Pi traffic, run 20260910T160142-0400 r02 repeated the
  full grid on the same containers, without a restart or configuration change.
  All 15 cells passed; measured running counts matched concurrency exactly,
  with zero new JIT warnings or runtime errors. Final completion and all four
  rank health checks passed at 16:14:16 EDT.
  Quiet R32 geomeans C1/C2/C4 output 52.7959/82.3413/120.5124 tok/s,
  steps 20.1018/31.2435/45.3211. Versus the full R29 baseline, engine changes
  are +0.91/+0.53/-0.68 percent; C2/C4 output changes +1.05/-0.70 percent.
  Versus the stronger R29 C1 repeat, output is +2.60 percent and steps +1.01.
  Quiet prefill 2780/2946/2944/2938/2873 tok/s at 8/16/32/64/128K.
  Individual output/acceptance variation remains; this is not proof of a
  repeatable speedup or universal per-cell output parity. R29 remains stopped
