result_notes: >-
  Warm boot passed every serving gate and the health review; the grid is valid against the October 4
  baseline (same checkpoint, harness cc9bb06a, KV budget). Geometric means C1/C2/C4: output tok/s
  -4.9/-3.2/+1.0%, steps/s -0.9/-3.3/-0.2%, effective acceptance -4.1/+0.1/+1.2%. Prefill 16K-128K
  within 0.7% (8K +23% is the baseline's first-use outlier). Coding peak median 66.9 vs 71.6 tok/s.
  GPU KV 5,313,211 vs 5,191,165 tokens. No kernel events during the grid. Same pattern as the October 1
  candidate the user rejected (-3.77/-1.86/+1.31%); one grid, so boot variance is not separated.
  Production 7c4f1bc1 pair restored 2026-10-05T18:31Z; candidate containers retained, not promoted.
repeat_notes: >-
  Second grid on a fresh boot of the unmodified image (natural selections cached from the first boot),
  requested to see whether the MTP acceptance loss recovers. It did (C1 effective acceptance 2.07, equal to
  baseline) but steps/s fell further: output tok/s -4.9/-2.5/-2.0%, steps/s -4.9/-6.8/-3.4%, acceptance
  0.0/+4.6/+1.5% at C1/C2/C4. Mean of the two grids: output tok/s -4.9/-2.9/-0.5%, steps/s -2.9/-5.0/-1.8%.
  Decode steps/s is lower than production in both grids at every concurrency, so the regression is in
  engine step rate, not MTP acceptance. r02 prefill was also 1.5-7.7% lower at 16K-128K (r01 was within
  0.7%); not separated from boot variance. Coding peak median 67.6 (r01 66.9) vs 71.6 tok/s.
  Production restored again 2026-10-05T19:07Z; candidate containers retained as *-warm-r1 and *-r2.
